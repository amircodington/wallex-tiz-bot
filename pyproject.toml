[project]
name = "tiz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amircodington", email = "amircodington@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "websockets>=17.3",
]

[project.scripts]
